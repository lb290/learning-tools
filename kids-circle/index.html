<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>圆的乐园 · 小学数学圆的知识互动学习</title>
  <meta name="description" content="小学数学「圆」互动学习工具：圆的概念、圆周率、1π~100π、半径直径、圆周长、圆面积、扇形、阴影面积，含演示、学习、操作、测试四大板块。">
  <meta name="theme-color" content="#f6f9ff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23dbeafe' stroke='%232563eb' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%232563eb'/%3E%3Cline x1='50' y1='50' x2='50' y2='12' stroke='%23f59e0b' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body data-mode="demo">

  <a class="skip-link" href="#main">跳到主要内容</a>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="5"/>
          <circle cx="32" cy="32" r="3.5" fill="currentColor"/>
          <line x1="32" y1="32" x2="32" y2="9" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
          <line x1="32" y1="32" x2="55" y2="32" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>圆的乐园</h1>
        <p>小学数学 · 圆的世界互动学习</p>
      </div>
    </div>

    <nav class="mode-switch" role="tablist" aria-label="选择学习板块">
      <button type="button" class="mode-tab active" data-mode="demo" role="tab" aria-selected="true" aria-controls="panel-demo" id="tab-demo">
        <span class="tab-icon" aria-hidden="true">🎬</span><span class="tab-text">演示</span>
      </button>
      <button type="button" class="mode-tab" data-mode="learn" role="tab" aria-selected="false" aria-controls="panel-learn" id="tab-learn">
        <span class="tab-icon" aria-hidden="true">📖</span><span class="tab-text">学习</span>
      </button>
      <button type="button" class="mode-tab" data-mode="lab" role="tab" aria-selected="false" aria-controls="panel-lab" id="tab-lab">
        <span class="tab-icon" aria-hidden="true">🧪</span><span class="tab-text">操作</span>
      </button>
      <button type="button" class="mode-tab" data-mode="quiz" role="tab" aria-selected="false" aria-controls="panel-quiz" id="tab-quiz">
        <span class="tab-icon" aria-hidden="true">🏆</span><span class="tab-text">测试</span>
      </button>
    </nav>

    <button type="button" class="sound-toggle" id="soundToggle" aria-pressed="true" aria-label="关闭音效" title="音效开关">🔊</button>
  </header>

  <main id="main">
    <!-- 演示 -->
    <section class="mode-panel active" data-mode="demo" id="panel-demo" role="tabpanel" aria-labelledby="tab-demo">
      <div class="mode-root" id="mode-demo"></div>
    </section>
    <!-- 学习 -->
    <section class="mode-panel" data-mode="learn" id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
      <div class="mode-root" id="mode-learn"></div>
    </section>
    <!-- 操作 -->
    <section class="mode-panel" data-mode="lab" id="panel-lab" role="tabpanel" aria-labelledby="tab-lab" hidden>
      <div class="mode-root" id="mode-lab"></div>
    </section>
    <!-- 测试 -->
    <section class="mode-panel" data-mode="quiz" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="mode-root" id="mode-quiz"></div>
    </section>
  </main>

  <footer class="footer">
    <p>⭕ 圆的乐园 · 圆是世界上最完美的图形之一，动手试试，你会发现它的秘密！</p>
    <p class="footer-sub">计算时 π 取 3.14 · 纯前端离线页面，不需要联网</p>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
